name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # QA gate 1: `next build` with zero warnings. Next exits 0 on warnings, so grep for its ⚠ marker.
      - name: Build
        shell: bash
        run: |
          npm run build 2>&1 | tee build.log
          if grep -q "⚠" build.log; then
            echo "::error::next build printed warnings (QA gate 1 requires zero):"
            grep "⚠" build.log
            exit 1
          fi
        env:
          NEXT_TELEMETRY_DISABLED: 1
